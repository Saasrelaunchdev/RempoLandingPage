<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Review Race · Rempo</title>
  <meta name="description" content="See how your Google reviews compare with the three shops homeowners see first near you. Free, in about a minute.">
  <link rel="icon" href="/race/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/race/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/race/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/race/race.css">
  <style>
    /* This page only: a plain hero and footer around the two mount points, so the tool can be tested on its own.
       On the landing page, the hero CTA and the section drop in as they are (README.md, "Merging"). */
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #F3F7FC; color: #1A2E4C; font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .top { max-width: 1080px; margin: 0 auto; padding: 18px 16px; display: flex; align-items: center; gap: 10px; }
    .top img { width: 32px; height: 32px; }
    .top b { font: 650 22px/1 "Outfit", system-ui, sans-serif; color: #0A1A33; letter-spacing: -.01em; }
    .hero { max-width: 1080px; margin: 0 auto; padding: 28px 16px 56px; display: grid; gap: 22px; }
    .hero .eyebrow { font: 600 13px/1.3 "Geist", system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #0057B3; margin: 0; }
    .hero h1 { font: 650 clamp(34px, 8vw, 58px)/1.05 "Outfit", system-ui, sans-serif; letter-spacing: -.025em; color: #0A1A33; margin: 0; max-width: 14ch; }
    .hero p.lead { font-size: clamp(17px, 2.6vw, 20px); line-height: 1.5; color: #465C7E; margin: 0; max-width: 34em; }
    .hero .note { font-size: 14px; color: #5F7699; margin: 0; }
    .race-section { padding: 48px 0 64px; background: #fff; border-top: 1px solid #E8EFF9; }
    footer { max-width: 1080px; margin: 0 auto; padding: 22px 16px 40px; font-size: 14px; color: #5F7699; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    footer a { color: #0057B3; }
  </style>
</head>
<body>
  <header class="top"><img src="/race/favicon.svg" alt="" width="32" height="32"><b>Rempo</b></header>

  <main>
    <section class="hero" aria-labelledby="hero-h1">
      <p class="eyebrow">For HVAC and plumbing shop owners</p>
      <h1 id="hero-h1">Your work is better. Do your reviews show it?</h1>
      <p class="lead">See how your Google reviews compare with the three shops homeowners see first near you. Free, in about a minute.</p>
      <!-- Mount point 1: the hero CTA. Picking a business scrolls to the section below and starts the race there. -->
      <div data-review-race-cta data-target="#review-race" id="hero-race"></div>
      <p class="note">Free. No card, no call needed.</p>
    </section>

    <!-- Mount point 2: the section, the whole tool. Results links (?r=...) open here. -->
    <section class="race-section" id="review-race" data-review-race aria-label="Review race"></section>
  </main>

  <footer>
    <span>Rempo · rempo.io</span>
    <a href="https://rempo.io/legal/privacy" target="_blank" rel="noopener">Privacy Policy</a>
    <a href="https://rempo.io/legal/terms" target="_blank" rel="noopener">Terms of Service</a>
  </footer>

  <script type="module" src="/race/race.js"></script>
</body>
</html>
